<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/practicaformulario.css">
    <script src="../js/practicaformulario.js"></script>
</head>

<body>
    <div class="container">
        <header></header>
        <div class="img_"><img src="../img/card.png" alt=""></div>
        <div class="formulario">
            <nav></nav>
            <section>
                <form action="#">
                    <h2>PAYMENTS DETAILS</h2>
                    <h3>Information Card</h3>
                    <div id="id_msg_error" class="msg_error"></div>
                    <p type="Cardholder Name"><input id="id_name" type="text"><span id="id_error_nombre"
                            class="error_asterisco"></span></p>
                    <div id="id_msg_error" class="msg_error"></div>
                    <p type="Card Number"><input id="id_card" maxlength="16" type="number"><span id="id_error_card"
                            class="error_asterisco"></span></p>
                    <div id="id_msg_error" class="msg_error"></div>
                    <p type="Exp Date"><input type="text" id="id_date" placeholder="MM/YY" maxlength="5"
                            pattern="(0[1-9]|1[0-2])\/\d{2}" required><span id="id_error_date"
                            class="error_asterisco"></span></p>
                    <div id="id_msg_error" class="msg_error"></div>
                    <p type="CVV"><input id="id_cvv" maxlength="3" type="password"><span id="id_error_cvv"
                            class="error_asterisco"></span></p>
                    <div class="center">
                        <button onclick="confirm()">Confirm</button>
                    </div>
                </form>
            </section>
        </div>
        <footer></footer>
    </div>

</body>

</html>
