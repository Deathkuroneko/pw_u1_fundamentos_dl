<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/calculadoraFinal.css">
    <script src="../js/calculadoraFinal.js" defer></script>
</head>

<body>
    <div class="container">
        <header class="barra_superior">Universidada Central del Ecuador</header>
        <nav class="barra_superior">Calculadora Final</nav>
        <section>
            <div id="calculadora">
                <!-- <label id="display" for="">0+1=1</label> -->
                 <div id="display"></div>
                <button onclick="mostraDisplay('C')">C</button>
                <button onclick="mostraDisplay('&#8592')">&#8592;</button>
                <button onclick="mostraDisplay('%')">%</button>
                <button onclick="mostraDisplay('/')">/</button>
                <button onclick="mostraDisplay(7)">7</button>
                <button onclick="mostraDisplay(8)">8</button>
                <button onclick="mostraDisplay(9)">9</button>
                <button onclick="mostraDisplay('*')">*</button>
                <button onclick="mostraDisplay(4)">4</button>
                <button onclick="mostraDisplay(5)">5</button>
                <button onclick="mostraDisplay(6)">6</button>
                <button onclick="mostraDisplay('-')">-</button>
                <button id="1" onclick="mostraDisplay(1)">1</button>
                <button onclick="mostraDisplay(2)">2</button>
                <button onclick="mostraDisplay(3)">3</button>
                <button onclick="mostraDisplay('+')">+</button>
                <button onclick="mostraDisplay(0)">0</button>
                <button onclick="mostraDisplay('.')">.</button>
                <button class="column-2" onclick="mostraDisplay('=')">=</button>

            </div>
        </section>
        <nav id="id_nota">% Transforma el numero en un decimal 55%  = 55/100 = 0.55</nav>
        <footer id="id_footer">Programación Web <br> <br> Lema Casa Dylan Antonio</footer>
    </div>
</body>

</html>
